# MessagePusher 单机部署(物理机 Docker Compose)。
# 统一数据库驱动: PostgreSQL + Redis, 消息队列为数据库轮询(内置消费者)。

services:
  # ---- 基础设施 ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mp
      POSTGRES_PASSWORD: ${MP_DB_PASSWORD:-mp_secret_2026}
      POSTGRES_DB: messagepusher
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ---- 应用 ----
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["api"]
    environment:
      MP_DB_TYPE: postgres
      MP_DB_HOST: postgres
      MP_DB_PORT: "5432"
      MP_DB_USER: mp
      MP_DB_PASSWORD: ${MP_DB_PASSWORD:-mp_secret_2026}
      MP_DB_NAME: messagepusher
      MP_REDIS_ADDR: redis:6379
      MP_REDIS_FALLBACK: "true"
      MP_JWT_SECRET: ${MP_JWT_SECRET:?请在 .env 中设置 MP_JWT_SECRET}
      MP_ADMIN_PATH: ${MP_ADMIN_PATH:-admin}
      MP_PORT: "8080"
    ports:
      - "${MP_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
